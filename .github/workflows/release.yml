name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version and changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          test "$RELEASE_TAG" = "v$version"
          test "$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -1)" = "$version"
          grep -F "## [$version] - " CHANGELOG.md
      - run: rustup show
      - run: make check
  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Publish checked release
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
