[advisories]
version = 2
unmaintained = "all"
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.95
include-dev = true
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "ISC", "BSD-3-Clause", "CDLA-Permissive-2.0"]

[bans]
multiple-versions = "deny"
wildcards = "deny"
# tracing-attributes and Windows support still use syn 2; current derives use 3.
# Revisit this exact exception on dependency updates (AGENTS.md).
skip = [{ name = "syn", version = "=2.0.119" }]
deny = [{ name = "openssl" }, { name = "openssl-sys" }, { name = "native-tls" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
